name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer run phpcs

  static-analysis:
    runs-on: ubuntu-latest
    needs: lint-php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer run phpstan

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:js

  test-php:
    runs-on: ubuntu-latest
    needs: [ lint-php, static-analysis ]
    strategy:
      matrix:
        php: [ '8.1', '8.4' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer run test

  build:
    runs-on: ubuntu-latest
    needs: [ test-php, lint-js ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader
      - run: npm ci
      - run: npm run build
      - name: Package release zip
        run: |
          mkdir -p dist/nutrio
          rsync -a --exclude-from=.distignore ./ dist/nutrio/
          cd dist && zip -r nutrio.zip nutrio
      - uses: actions/upload-artifact@v7
        with:
          name: nutrio
          path: dist/nutrio.zip
