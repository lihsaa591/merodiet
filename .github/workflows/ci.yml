name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer run phpcs

  static-analysis:
    runs-on: ubuntu-latest
    needs: lint-php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer run phpstan

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:js

  test-php:
    runs-on: ubuntu-latest
    needs: [ lint-php, static-analysis ]
    strategy:
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer run test

  build:
    runs-on: ubuntu-latest
    needs: [ test-php, lint-js ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader
      - run: npm ci
      - run: npm run build
      - name: Package release zip
        run: |
          mkdir -p dist/nutrio
          rsync -a --exclude-from=.distignore ./ dist/nutrio/
          cd dist && zip -r nutrio.zip nutrio
      - uses: actions/upload-artifact@v7
        with:
          name: nutrio
          path: dist/nutrio.zip

  a11y:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: composer install --no-progress --prefer-dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wp-env start
      - name: Run accessibility scans
        run: npx playwright test tests/e2e
        env:
          WP_BASE_URL: http://localhost:8888
        continue-on-error: true
      - name: Summarize accessibility findings
        if: always()
        run: node tests/e2e/helpers/summarize-report.js >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-report
          path: playwright-report/
          if-no-files-found: warn
